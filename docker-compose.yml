services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: podcastcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: podcastcc
    volumes:
      - podcastcc_compose_db_data:/var/lib/postgresql/data
    networks:
      - podcastcc-compose

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - podcastcc-compose

  migrate:
    # Targets the "builder" stage, not the final lean "runner" image, because
    # it needs the full node_modules (prisma CLI, tsx for the seed script) —
    # the runner only ships the standalone Next.js server.
    build:
      context: .
      target: builder
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - podcastcc-compose

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - podcastcc_compose_caddy_data:/data
    networks:
      - podcastcc-compose

networks:
  podcastcc-compose:

volumes:
  podcastcc_compose_db_data:
  podcastcc_compose_caddy_data:
